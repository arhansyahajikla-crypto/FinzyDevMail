<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06142f">
  <title>FinzyDevMail</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div><div class="ambient ambient-c"></div>

  <section id="auth" class="auth-shell">
    <div class="brand-hero">
      <div class="brand-icon">✉</div>
      <div class="brand-name">FinzyDev<span>Mail</span></div>
      <div class="brand-sub">Email Automation <i>•</i> Faster <i>•</i> Smarter</div>
    </div>
    <div class="auth-card glass">
      <div class="eyebrow">✉ &nbsp; SETORAN GML</div>
      <h1 id="authTitle">Masuk</h1>
      <p id="authSubtitle" class="muted">Masuk untuk melanjutkan</p>
      <div id="nameWrap" class="field hidden"><span>♙</span><input id="name" autocomplete="name" placeholder="Nama"></div>
      <div class="field"><span>✉</span><input id="email" type="email" autocomplete="email" placeholder="Email"></div>
      <div class="field"><span>♙</span><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button class="eye" onclick="togglePassword()" aria-label="Tampilkan password">◉</button></div>
      <button id="authButton" class="primary-btn" onclick="submitAuth()">↪ &nbsp; Masuk</button>
      <button class="secondary-btn" onclick="googleLogin()"><b class="g">G</b> Lanjut dengan Google</button>
      <button id="switchAuth" class="text-btn" onclick="toggleAuth()">Belum punya akun? <b>Daftar →</b></button>
      <div id="authMsg" class="form-msg hidden"></div>
    </div>
  </section>

  <section id="app" class="app-shell hidden">
    <header class="topbar glass">
      <div class="mini-brand"><span class="mini-icon">✉</span> FinzyDev<span>Mail</span></div>
      <div class="top-actions"><span id="roleBadge" class="role-badge">USER</span><button class="icon-btn" onclick="logout()">↪</button></div>
    </header>

    <main id="page" class="page"></main>

    <nav id="userNav" class="bottom-nav glass">
      <button data-page="home" onclick="show('home')"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3l8.5 7.5V21a1 1 0 0 1-1 1h-5.1v-6.1H9.6V22H4.5a1 1 0 0 1-1-1z"/></svg></span><small>Beranda</small></button>
      <button data-page="job" onclick="show('job')"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx=".5" fill="currentColor" stroke="none"/></svg></span><small>Job</small></button>
      <button data-page="generate" onclick="show('generate')"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9z"/><path d="m19 15 .8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg></span><small>Generate</small></button>
      <button data-page="history" onclick="show('history')"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5l3.4 2"/></svg></span><small>Riwayat</small></button>
      <button data-page="profile" onclick="show('profile')"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="3.2"/><path d="M5.5 21c.4-4 2.5-6.1 6.5-6.1s6.1 2.1 6.5 6.1"/></svg></span><small>Profil</small></button>
    </nav>

    <nav id="adminNav" class="bottom-nav glass hidden">
      <button data-page="admin" onclick="show('admin')"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3l8.5 7.5V21a1 1 0 0 1-1 1h-5.1v-6.1H9.6V22H4.5a1 1 0 0 1-1-1z"/></svg></span><small>Dashboard</small></button>
      <button data-page="adminSub" onclick="show('adminSub')"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx=".5" fill="currentColor" stroke="none"/></svg></span><small>Setoran</small></button>
      <button data-page="stock" onclick="show('stock')"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9z"/><path d="m19 15 .8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg></span><small>Stok</small></button>
      <button data-page="adminWd" onclick="show('adminWd')"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7"/><path d="M9 7h8v8"/><path d="M5 5h5"/><path d="M5 5v5"/></svg></span><small>Withdraw</small></button>
      <button data-page="members" onclick="show('members')"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="3.2"/><path d="M5.5 21c.4-4 2.5-6.1 6.5-6.1s6.1 2.1 6.5 6.1"/></svg></span><small>Anggota</small></button>
    </nav>
  </section>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
