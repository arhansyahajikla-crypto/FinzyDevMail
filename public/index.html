<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SetorangML</title><link rel="stylesheet" href="style.css"></head><body>
<div id="auth" class="auth"><div class="authbox"><div class="logo">✉ <b>SETORANGML</b></div><h1 id="authTitle">Masuk</h1><p class="muted">Masuk untuk melanjutkan</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="submitAuth()">Masuk</button><button class="google" onclick="googleLogin()">Lanjut dengan Google</button><p id="switch" class="link" onclick="toggleAuth()">Belum punya akun? Daftar</p></div></div>
<div id="app" hidden><header><div class="logo">✉ <b>SETORANGML</b></div><button class="icon" onclick="logout()">↪</button></header><main id="page"></main><nav><button onclick="show('home')">⌂<span>Beranda</span></button><button onclick="show('job')">➤<span>Job</span></button><button onclick="show('withdraw')">▣<span>Tarik</span></button><button onclick="show('generate')">✣<span>Generate</span></button><button onclick="show('history')">◷<span>Riwayat</span></button><button onclick="show('profile')">♙<span>Profil</span></button></nav></div>
<script src="app.js"></script></body></html>
