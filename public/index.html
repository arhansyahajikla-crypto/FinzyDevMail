<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06142f">
  <title>FinzyDevMail</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div><div class="ambient ambient-c"></div>

  <section id="auth" class="auth-shell">
    <div class="brand-hero">
      <div class="brand-icon">✉</div>
      <div class="brand-name">FinzyDev<span>Mail</span></div>
      <div class="brand-sub">Email Automation <i>•</i> Faster <i>•</i> Smarter</div>
    </div>
    <div class="auth-card glass">
      <div class="eyebrow">✉ &nbsp; SETORAN GML</div>
      <h1 id="authTitle">Masuk</h1>
      <p id="authSubtitle" class="muted">Masuk untuk melanjutkan</p>
      <div id="nameWrap" class="field hidden"><span>♙</span><input id="name" autocomplete="name" placeholder="Nama"></div>
      <div class="field"><span>✉</span><input id="email" type="email" autocomplete="email" placeholder="Email"></div>
      <div class="field"><span>♙</span><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button class="eye" onclick="togglePassword()" aria-label="Tampilkan password">◉</button></div>
      <button id="authButton" class="primary-btn" onclick="submitAuth()">↪ &nbsp; Masuk</button>
      <button class="secondary-btn" onclick="googleLogin"><b class="g">G</b> Lanjut dengan Google</button>
      <button id="switchAuth" class="text-btn" onclick="toggleAuth()">Belum punya akun? <b>Daftar →</b></button>
      <div id="authMsg" class="form-msg hidden"></div>
    </div>
  </section>

  <section id="app" class="app-shell hidden">
    <header class="topbar glass">
      <div class="mini-brand"><span class="mini-icon">✉</span> FinzyDev<span>Mail</span></div>
      <div class="top-actions"><span id="roleBadge" class="role-badge">USER</span><button class="icon-btn" onclick="logout()">↪</button></div>
    </header>

    <main id="page" class="page"></main>

    <nav id="userNav" class="bottom-nav glass">
      <button data-page="home" onclick="show('home')"><span class="nav-icon">⌂</span><small>Beranda</small></button>
      <button data-page="job" onclick="show('job')"><span class="nav-icon">▣</span><small>Job</small></button>
      <button data-page="generate" onclick="show('generate')"><span class="nav-icon">✦</span><small>Generate</small></button>
      <button data-page="history" onclick="show('history')"><span class="nav-icon">◷</span><small>Riwayat</small></button>
      <button data-page="profile" onclick="show('profile')"><span class="nav-icon">♙</span><small>Profil</small></button>
    </nav>

    <nav id="adminNav" class="bottom-nav glass hidden">
      <button data-page="admin" onclick="show('admin')"><span class="nav-icon">⌂</span><small>Dashboard</small></button>
      <button data-page="adminSub" onclick="show('adminSub')"><span class="nav-icon">▣</span><small>Setoran</small></button>
      <button data-page="adminWd" onclick="show('adminWd')"><span class="nav-icon">↗</span><small>WS/Tarik</small></button>
      <button data-page="members" onclick="show('members')"><span class="nav-icon">♙</span><small>Anggota</small></button>
      <button data-page="profile" onclick="show('profile')"><span class="nav-icon">⚙</span><small>Profil</small></button>
    </nav>
  </section>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
